<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F6F3" />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <title>Sumar Comandă — Muncho Food Court</title>
  <link rel="stylesheet" href="css/main.css?v=38" />
</head>
<body data-page="ticket">
<div class="wrap">
  <header class="site-head">
    <div class="brand-row" style="margin-bottom:0;">
      <a href="index.html" class="round-btn" aria-label="Înapoi">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </a>
      <div style="text-align:center;flex:1;">
        <h2 style="font-size:17px;">Sumar comandă</h2>
        <p style="font-size:11.5px;color:var(--ink-3);font-weight:700;">Casa · Argeș Mall Food Court</p>
      </div>
      <span class="round-btn" style="opacity:0;" aria-hidden="true"></span>
    </div>
  </header>

  <main style="padding-bottom:60px;">
    <div id="ticket-error" hidden>
      <section class="page-pad" style="padding-top:20px;">
        <div class="card" style="text-align:center;padding:30px 18px;">
          <div style="width:64px;height:64px;border-radius:50%;background:var(--danger-soft);color:var(--danger);display:grid;place-items:center;margin:0 auto 14px;font-size:26px;font-weight:800;">?</div>
          <p style="font-weight:800;font-size:16px;margin-bottom:6px;">Cod invalid sau expirat</p>
          <p style="font-size:13px;color:var(--ink-2);">Scanează din nou codul de pe ecranul clientului.</p>
          <a href="index.html" class="btn-secondary" style="display:inline-flex;margin-top:14px;">Înapoi la meniu</a>
        </div>
      </section>
    </div>

    <div id="ticket-card" hidden>
      <section class="page-pad" style="padding-top:16px;">
        <div class="card" style="text-align:center;">
          <div class="card-head" style="justify-content:center;">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1.5 2 1.5 2-1.5 2 1.5 2-1.5 2 1.5 2-1.5 2 1.5V2l-2 1.5L16 2l-2 1.5L12 2l-2 1.5L8 2 6 3.5 4 2z"/></svg>
            De plătit la casă
          </div>

          <div class="success-code num" id="ticket-code" style="font-size:46px;">#M-100</div>
          <div id="ticket-date" class="countdown" style="margin-top:6px;margin-bottom:4px;"></div>

          <div class="pickup-pill" id="ticket-slot-pill">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            <span id="ticket-slot">Ridicare: —</span>
          </div>
        </div>

        <div class="card" style="margin-top:12px;">
          <div class="card-head">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></svg>
            Preparate comandate
          </div>
          <div id="ticket-items"></div>
          <div class="totals">
            <div class="trow grand"><span>Total de încasat</span><span class="num" id="ticket-total">—</span></div>
          </div>
          <div class="paid-row" id="ticket-method" aria-label="Metoda de plată"></div>
        </div>
      </section>
    </div>
  </main>
</div>

<script>
(function () {
  'use strict';

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function decodeTicket() {
    try {
      const hash = location.hash || '';
      const m = hash.match(/[#&]o=([A-Za-z0-9\-_]+)/);
      if (!m) return null;
      const b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
      const json = decodeURIComponent(escape(window.atob(b64)));
      const o = JSON.parse(json);
      if (!o || !o.c || !Array.isArray(o.i)) return null;
      return o;
    } catch (e) {
      return null;
    }
  }

  function money(v) {
    return Number(v || 0).toFixed(2).replace('.', ',') + ' lei';
  }

  const t = decodeTicket();
  if (!t) {
    document.getElementById('ticket-error').hidden = false;
    return;
  }

  document.getElementById('ticket-card').hidden = false;
  document.getElementById('ticket-code').textContent = '#' + t.c;
  document.getElementById('ticket-date').textContent = t.d || '';

  const slotPill = document.getElementById('ticket-slot-pill');
  if (t.e) {
    document.getElementById('ticket-slot').textContent = 'Gata în ~' + t.e + ' min';
  } else if (t.s) {
    document.getElementById('ticket-slot').textContent = 'Ridicare: ' + t.s; // older tickets
  } else {
    slotPill.style.display = 'none';
  }

  document.getElementById('ticket-items').innerHTML = t.i.map(function (row) {
    const title = row[0], qty = row[1], price = row[2];
    return '<div class="rowline">' +
      '<div class="grow"><strong>' + esc(title) + '</strong><span>cantitate: × ' + esc(qty) + '</span></div>' +
      '<span class="num amount">' + money(price * qty) + '</span>' +
    '</div>';
  }).join('');

  document.getElementById('ticket-total').textContent = money(t.t);

  const methodLabel = {
    TEJ: 'Plată la ridicare', 'GOOGLE PAY': 'Google Pay', 'APPLE PAY': 'Apple Pay',
    STRIPE: 'Card (Stripe)', CASH: 'Numerar', SAVE: 'Plată la ridicare'
  }[t.m] || t.m || 'Plată la ridicare';
  document.getElementById('ticket-method').innerHTML =
    '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>' +
    '<span>' + esc(methodLabel) + '</span>';
})();
</script>
</body>
</html>
