<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F6F3" />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <title>Restaurant — Muncho Food Court Argeș Mall</title>
  <link rel="stylesheet" href="css/main.css?v=39" />
</head>
<body data-page="venue">

<div class="wrap">
  <h1 class="sr-only">Meniul restaurantului din Food Court Argeș Mall</h1>

  <main style="padding-bottom: 220px;">
    <!-- Hero cover -->
    <div class="venue-hero" id="venue-hero"></div>

    <!-- Venue intro -->
    <div class="venue-intro" id="venue-intro"></div>
    <div class="venue-pillrow" id="venue-pillrow"></div>

    <!-- Sticky section chips -->
    <nav class="chips sticky" id="venue-chips" aria-label="Categorii meniu"></nav>

    <!-- In-menu search -->
    <div class="page-pad" style="padding-top:14px;">
      <div class="search">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.1"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="venue-search-input" type="search" placeholder="Caută în meniul acestui restaurant…" autocomplete="off" aria-label="Caută în meniu" />
        <button type="button" class="search-clear" id="venue-search-clear" hidden aria-label="Șterge căutarea">&times;</button>
      </div>
    </div>

    <!-- Menu sections -->
    <div id="venue-menu"></div>
  </main>

  <!-- Floating tab bar -->
  <nav class="tabbar three" aria-label="Navigare principală">
    <a class="tab" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="20" height="20" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      <span>Acasă</span>
    </a>
    <button class="tab" type="button" data-action="open-cart-sheet" aria-label="Vezi coșul">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="20" height="20" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></svg>
      <span>Coș</span>
      <span class="bub num" data-bub="cart" hidden>0</span>
    </button>
    <button class="tab" type="button" data-action="open-orders-sheet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="20" height="20" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1.5 2 1.5 2-1.5 2 1.5 2-1.5 2 1.5 2-1.5 2 1.5V2l-2 1.5L16 2l-2 1.5L12 2l-2 1.5L8 2 6 3.5 4 2z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      <span>Comenzi</span>
      <span class="bub num" data-bub="orders" hidden>0</span>
    </button>
  </nav>

  <div class="sheet-scrim" id="sheet-scrim"></div>

  <!-- Cart sheet -->
  <section class="sheet" id="cart-sheet" role="dialog" aria-modal="true" aria-label="Coșul tău">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head">
      <h3>Coșul tău</h3>
      <button type="button" class="round-btn" data-action="close-sheet" aria-label="Închide">&times;</button>
    </div>
    <div class="sheet-body" id="cart-sheet-body"></div>
    <div class="sheet-foot" id="cart-sheet-foot">
      <div class="row">
        <span class="lbl">Total de plată</span>
        <span class="val num" id="cart-sheet-total">0,00 lei</span>
      </div>
      <button type="button" class="btn-primary" data-action="checkout-go">
        Continuă — alege ora ridicării
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>
  </section>

  <!-- Orders sheet -->
  <section class="sheet" id="orders-sheet" role="dialog" aria-modal="true" aria-label="Rezervările tale">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head">
      <h3>Rezervările tale</h3>
      <button type="button" class="round-btn" data-action="close-sheet" aria-label="Închide">&times;</button>
    </div>
    <div class="sheet-body" id="orders-sheet-body"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="js/menu.generated.js?v=3"></script>
<script src="js/config.js?v=4"></script>
<script src="js/data.js?v=4"></script>
<script src="js/sapori-bridge.js?v=2"></script>
<script src="js/app.js?v=40"></script>
</body>
</html>
